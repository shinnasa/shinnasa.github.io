# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Shinpei Nakamura-Sakai"
title_separator          : "-"
name                     : &name "Shinpei Nakamura-Sakai"
description              : &description "Shinpei Nakamura-Sakai, Applied Scientist at Amazon and Yale PhD in Statistics & Data Science. Causal inference, synthetic data, and applied machine learning."
url                      : https://shinnasa.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "shinnasa/shinnasa.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : "Person"
  name                   : # If the user or organization name differs from the site's name
  # Feeds the schema.org "sameAs" array.
  links:
    - "https://www.linkedin.com/in/shinpei-nakamura-sakai-299a13109/"
    - "https://scholar.google.com/citations?user=jzZ_XwsAAAAJ&hl=en"
    - "https://orcid.org/0000-0001-6413-5412"
    - "https://github.com/shinnasa"
    - "https://www.amazon.science/author/nakamura-sakai-shinpei"


# Site Author
author:
  name             : "Shinpei Nakamura-Sakai"
  avatar           : "FormalShinpei.jpg"
  bio              : "Applied Scientist"
  location         : "Amazon"
  # location_url is a local addition (see _includes/author-profile.html) that makes
  # the location line a link; the stock theme renders it as plain text.
  location_url     : "https://www.amazon.science/author/nakamura-sakai-shinpei"
  employer         :
  pubmed           : # "https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  googlescholar    : "https://scholar.google.com/citations?user=jzZ_XwsAAAAJ&hl=en&authuser=1"
  email            :
  researchgate     :  # example: "https://www.researchgate.net/profile/yourprofile"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "shinnasa"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  lastfm           :
  # SLUG only, not the full URL — author-profile.html prepends https://www.linkedin.com/in/
  linkedin         : "shinpei-nakamura-sakai-299a13109"
  # TODO(user): confirm this ORCID iD is yours. Taken from your Journal of
  # Experimental Political Science author entry, not verified against orcid.org.
  orcid            : "https://orcid.org/0000-0001-6413-5412"
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

google_analytics: G-CMKT6WVD0Z
